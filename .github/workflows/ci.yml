name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parfums
          POSTGRES_PASSWORD: parfums
          POSTGRES_DB: parfums_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://parfums:parfums@localhost:5432/parfums_test
      TEST_DATABASE_URL: postgresql+psycopg://parfums:parfums@localhost:5432/parfums_test
      SECRET_KEY: secret-de-ci-uniquement-pour-les-tests
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run alembic check  # les modèles et les migrations doivent correspondre
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Parcours navigateur réels : base → API → frontend → Chromium (mobile + ordinateur).
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: parfums
          POSTGRES_PASSWORD: parfums
          POSTGRES_DB: parfums
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://parfums:parfums@localhost:5432/parfums
      BACKEND_INTERNAL_URL: http://localhost:8000
      SECRET_KEY: secret-de-ci-uniquement-pour-les-tests
      # Comptes de test E2E (gestionnaire avec double authentification, livreur) : CI uniquement.
      SEED_STAFF_PASSWORD: motdepasse-e2e-uniquement
      SEED_MANAGER_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false  # l'API tourne encore en fin de job et verrouillerait le cache
      - name: Démarrer l'API
        working-directory: backend
        run: |
          uv sync --locked
          uv run alembic upgrade head
          uv run python -m app.scripts.seed_demo
          uv run fastapi run app/main.py --port 8000 &
          timeout 60 bash -c 'until curl -sf http://localhost:8000/api/v1/health; do sleep 1; done'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Tests de parcours
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
