<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Catalogue — tous les parfums</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#FAFAF8}
a{color:#1A1613}a:hover{color:#9A5B13}
.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;color:#1A1613;padding:0;cursor:pointer;position:relative;text-decoration:none}
.serif{font-family:'Bodoni Moda',serif;font-weight:500}
</style>
</helmet>
<div style="width: 390px; height: 1560px; background: #FAFAF8; color: #1A1613; font-family: 'Manrope', sans-serif; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 6px; border-bottom: 1px solid #E2DDD5">
    <button class="ib" aria-label="Menu"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <a href="Main.dc.html" class="serif" style="font-size: 16px; letter-spacing: .24em; text-decoration: none; color: #1A1613">PROJET PARFUMS</a>
    <a href="Panier.dc.html" class="ib" aria-label="Panier, 2 articles"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="position: absolute; top: 7px; right: 6px; min-width: 16px; height: 16px; border-radius: 8px; background: #9A5B13; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span></a>
  </header>

  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <nav aria-label="Fil d'Ariane" style="font-size: 12px; color: #6B635B"><a href="Main.dc.html" style="color: #6B635B">Accueil</a> / Parfums</nav>
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 class="serif" style="margin: 0; font-size: 32px">Tous les parfums</h1>
      <span style="font-size: 13px; color: #6B635B">12 résultats</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid #CFC8BE; background: #FFFFFF">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#6B635B" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Rechercher un parfum</span>
      <input type="search" placeholder="Nom, note : vanille, oud…" style="flex: 1; border: 0; outline: 0; font: 15px 'Manrope', sans-serif; background: transparent; color: #1A1613">
    </label>
    <div style="display: flex; gap: 8px">
      <a href="Filtres.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 1px solid #1A1613; text-decoration: none; font-size: 14px; font-weight: 600"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>Filtres (2)</a>
      <label style="flex: 1; display: flex; align-items: center; height: 44px; border: 1px solid #CFC8BE; padding: 0 10px; font-size: 14px; gap: 6px">
        <span style="color: #6B635B">Trier</span>
        <select style="flex: 1; border: 0; background: transparent; font: 600 14px 'Manrope', sans-serif; color: #1A1613"><option>Nouveautés</option><option>Popularité</option><option>Prix croissant</option><option>Prix décroissant</option></select>
      </label>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px 0 12px; background: #EFEAE2; border: 0; border-radius: 17px; font: 500 13px 'Manrope', sans-serif; color: #1A1613; cursor: pointer">Femme<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-label="Retirer le filtre Femme" role="img"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
      <button style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px 0 12px; background: #EFEAE2; border: 0; border-radius: 17px; font: 500 13px 'Manrope', sans-serif; color: #1A1613; cursor: pointer">Floral<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-label="Retirer le filtre Floral" role="img"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
      <button style="height: 34px; padding: 0 6px; background: none; border: 0; font: 600 13px 'Manrope', sans-serif; color: #1A1613; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Tout effacer</button>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px; padding: 20px 16px 0">
    <sc-for list="{{products}}" as="p" hint-placeholder-count="6">
      <a href="Produit.dc.html" style="display: flex; flex-direction: column; gap: 10px; text-decoration: none; color: #1A1613; opacity: {{p.opacity}}">
        <div style="height: 210px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; position: relative">
          <svg viewBox="0 0 120 200" width="84" height="140" aria-hidden="true"><rect x="44" y="6" width="32" height="38" rx="2" fill="#1A1613"></rect><rect x="50" y="44" width="20" height="10" fill="#B9B1A6"></rect><rect x="18" y="54" width="84" height="136" rx="12" fill="{{p.glass}}"></rect><rect x="18" y="54" width="84" height="136" rx="12" fill="none" stroke="#1A1613" stroke-opacity=".18"></rect><rect x="28" y="66" width="7" height="110" rx="3.5" fill="#FFFFFF" fill-opacity=".35"></rect><rect x="38" y="112" width="44" height="34" fill="#FAFAF8" fill-opacity=".92"></rect><rect x="46" y="122" width="28" height="2" fill="#1A1613"></rect></svg>
          <sc-if value="{{p.badge}}" hint-placeholder-val="{{false}}">
            <span style="position: absolute; top: 10px; left: 10px; background: #FAFAF8; color: {{p.badgeColor}}; font-size: 11px; font-weight: 700; padding: 4px 8px">{{p.badge}}</span>
          </sc-if>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px">
          <div class="serif" style="font-size: 17px">{{p.name}}</div>
          <div style="font-size: 12px; color: #6B635B">{{p.family}} · 30 / 50 / 100 ml</div>
          <div style="font-size: 13px; font-weight: 600; margin-top: 2px">dès {{p.from}}</div>
        </div>
      </a>
    </sc-for>
  </div>
  <div style="padding: 32px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <span style="font-size: 13px; color: #6B635B">6 parfums affichés sur 12</span>
    <button style="width: 100%; height: 48px; background: none; border: 1px solid #1A1613; font: 600 14px 'Manrope', sans-serif; color: #1A1613; cursor: pointer">Voir plus de parfums</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      products: [
        { name: 'Fleur de Bassam', family: 'Floral', from: '26 000 FCFA', tint: '#EDD9D4', glass: '#C98B86', badge: 'Nouveau', badgeColor: '#1A1613', opacity: 1 },
        { name: 'Iris Poudré', family: 'Musqué', from: '25 000 FCFA', tint: '#DFDCE8', glass: '#8E86AE', badge: 'Plus que 3', badgeColor: '#9A5B13', opacity: 1 },
        { name: 'Jasmin Grand-Bassam', family: 'Floral', from: '27 000 FCFA', tint: '#EFE6D6', glass: '#D2B07A', badge: '', badgeColor: '#1A1613', opacity: 1 },
        { name: 'Rose Akwaba', family: 'Floral', from: '26 000 FCFA', tint: '#ECD5D8', glass: '#B9707E', badge: '', badgeColor: '#1A1613', opacity: 1 },
        { name: 'Tubéreuse Nuit', family: 'Floral', from: '28 000 FCFA', tint: '#E6E2DA', glass: '#A69A86', badge: 'Rupture de stock', badgeColor: '#6B635B', opacity: 0.6 },
        { name: 'Fleur de Coton', family: 'Floral', from: '23 000 FCFA', tint: '#E8EBEC', glass: '#A9B6BC', badge: '', badgeColor: '#1A1613', opacity: 1 }
      ]
    };
  }
}
</script>
</body>
</html>
